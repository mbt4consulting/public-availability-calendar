<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Manny's Availability</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      position: relative;
      overflow: hidden;
      background: #fff;
    }

    h1 {
      position: absolute;
      z-index: 2;
      top: 0;
      left: 7vw;
      width: calc(100% - 7vw);
      margin: 0;
      padding: 6px 16px;
      box-sizing: border-box;
      text-align: center;
      pointer-events: none;
      font: 600 20px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111;
    }

    iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
    }

    @media (max-width: 700px) {
      h1 {
        left: 0;
        width: 100%;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <h1>Manny's Availability</h1>
<iframe id="open-web-calendar" 
    style="background:url('https://raw.githubusercontent.com/niccokunzmann/open-web-calendar/master/static/img/loaders/circular-loader.gif') center center no-repeat;"
    src="https://open-web-calendar.hosted.quelltext.eu/calendar.html?ending_hour=22&amp;starting_hour=6"
    sandbox="allow-scripts allow-same-origin allow-top-navigation allow-downloads"
    allowTransparency="true" scrolling="no" 
    frameborder="0" height="597px" width="100%"></iframe>
  </body>
</html>
